<!doctype html><html><head><meta charset="UTF-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#243744}canvas{display:block}</style></head><body><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {ValleyPainter} from '/src/render/ValleyPainter.ts';
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const painter=new ValleyPainter(renderer),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-320,320,160,-160,.1,1000);

const material=painter.terrainMaterial('grass');

 const geo=new THREE.BufferGeometry(),z=row*76;
 geo.setAttribute('position',new THREE.Float32BufferAttribute([-300,0,z-60,300,0,z-60,-300,0,z+60,300,0,z+60],3));
 geo.setAttribute('normal',new THREE.Float32BufferAttribute(Array(4).fill([0,1,0]).flat(),3));
 geo.setAttribute('aBiome',new THREE.Float32BufferAttribute([0,collapsed?0:7,0,0,7,.4,0,collapsed?0:7,0,0,7,.4],3));
 geo.setAttribute('aClimate',new THREE.Float32BufferAttribute(Array(4).fill([.5,.1,0]).flat(),3));
 geo.setIndex([0,2,1,2,3,1]);scene.add(new THREE.Mesh(geo,material));
}
painter.shared.uCamPos.value.copy(camera.position);painter.shared.uFogDensity.value=0;
painter.shared.uSunDir.value.set(0,1,0);painter.shared.uSunColor.value.setRGB(1,1,1);painter.shared.uSkyColor.value.setRGB(.4,.5,.7);
// Remove spatial surface decoration so the fixture isolates categorical interpolation.
material.fragmentShader=material.fragmentShader.replace('g=paintGround(g,vWorld.xz,dist,0.);','').replace('g=mix(g,landStrokes(g,vWorld.xz,dist,sx,fwidth(sx)),.32);','').replace('g=mix(g,landStrokes(g,vWorld.xz,dist,sy,fwidth(sy)),.22);','').replace('float cloud=cloudAt(vWorld.xz);','float cloud=1.;');

window.biomeBlendFixture={ready:true,renderer,painter,scene,camera,render:()=>renderer.render(scene,camera)};
</script></body></html>
